name: P10 synthetic Explorer, CSV gates and Chromium E2E

on:
  pull_request:
    paths:
      - 'web/**'
      - 'tests/js/explorer*'
      - 'docs/EXPLORER_P10.md'
      - 'docs/release/P10_G5D_SYNTHETIC_ACCEPTANCE.md'
      - 'README.md'
      - '.github/workflows/p10-explorer.yml'
  push:
    paths:
      - 'web/**'
      - 'tests/js/explorer*'
      - '.github/workflows/p10-explorer.yml'

permissions:
  contents: read

jobs:
  explorer-contract-and-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install P02/P04 validation requirements
        run: python -m pip install -r requirements-test.txt
      - name: Build and validate entirely fictional P04 geometry
        run: |
          python -m pipeline spatial --workspace .p07-work
          python -m pipeline spatial-check --workspace .p07-work
      - name: Run every Python, Node, statistics and GIS regression test
        run: |
          python -m unittest discover -s tests -v
          node --test tests/js/*.test.mjs
      - name: Install pinned Chromium without third-party APT dependency
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install chromium
      - name: Run P07–P10 real Chromium interaction suites
        run: |
          python -m http.server 8765 --bind 127.0.0.1 >/tmp/p10-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          node tests/js/synthetic-map.e2e.mjs
          node tests/js/almanac.e2e.mjs
          node tests/js/art.e2e.mjs
          node tests/js/explorer.e2e.mjs
      - name: Fail if prohibited real-map or production statistical export appears
        run: |
          test ! -e web/data/world.json
          test ! -e web/data/districts_geometry.json
          test ! -e web/data/zones.json
          python -c "import json; d=json.load(open('.p07-work/spatial/manifest.synthetic.json')); assert d['synthetic'] is True and d['p01_g1_status']=='BLOCKED' and d['public_map_release_approved'] is False"
      - name: Upload synthetic Explorer desktop/mobile screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p10-synthetic-explorer-evidence
          path: artifacts/p10/*.png
          if-no-files-found: ignore
          retention-days: 7
