name: P03 offline ETL reproducibility

on:
  pull_request:
    paths:
      - 'pipeline/**'
      - 'schemas/**'
      - 'tests/**'
      - 'docs/ETL_PIPELINE.md'
      - 'docs/release/P03_G3_ACCEPTANCE.md'
      - 'docs/IMPLEMENTATION_PLAN.md'
      - 'README.md'
      - '.github/workflows/p03-offline-etl.yml'
  push:
    paths:
      - 'pipeline/**'
      - 'schemas/**'
      - 'tests/**'
      - '.github/workflows/p03-offline-etl.yml'

permissions:
  contents: read

jobs:
  offline-etl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install schema validation dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Re-run P01 and P02 checks and new P03 tests
        run: |
          python scripts/validate_p01_research.py
          python -m unittest discover -s tests -v
          node --test tests/js/*.test.mjs
      - name: Run full offline ETL
        run: |
          python -m pipeline list
          python -m pipeline all --offline --workspace .p03-work
          python -m pipeline check --workspace .p03-work
      - name: Verify byte-identical second build
        run: |
          find .p03-work -type f -name '*.json' -print0 | sort -z | xargs -0 sha256sum > /tmp/p03-before.sha256
          python -m pipeline all --offline --workspace .p03-work
          find .p03-work -type f -name '*.json' -print0 | sort -z | xargs -0 sha256sum > /tmp/p03-after.sha256
          diff -u /tmp/p03-before.sha256 /tmp/p03-after.sha256
      - name: Fail closed for unapproved public data
        run: |
          test ! -e web/data/world.json
          test ! -e web/data/districts_2024_observations.json
          python -c "import json; d=json.load(open('.p03-work/reports/p03_quality.json')); assert d['status']=='PASS' and d['p01_g1_status']=='BLOCKED' and d['public_map_release_approved'] is False"
